server:
  port: 8080

spring:
  application:
    name: wechat-link

# ==================== LLM 大语言模型配置 ====================
llm:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://ws-h7o2hyru91m6qked.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
  model: ${LLM_MODEL:qwen3.7-plus}
  timeout: ${LLM_TIMEOUT:30}
  max-tokens: ${LLM_MAX_TOKENS:2048}
  temperature: ${LLM_TEMPERATURE:0.7}
  system-prompt: ${LLM_SYSTEM_PROMPT:你是一个智能微信助手，请用简洁友好的语言回复用户的问题。}
