spring.application.name=demo
spring.datasource.url=jdbc:mysql://localhost:3306/demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## API配置（key 从 config.properties 载入，勿提交真实密钥）
spring.config.import=optional:file:config.properties
dashscope.api.key=${key:}
dashscope.api.url=https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation
dashscope.model.name=qwen-turbo
## 视觉模型（用于识别图片内容，可选值：qwen-vl-plus / qwen3-vl-plus / qwen2.5-vl-72b-instruct / qwen-vl-max）
dashscope.vision.model.name=qwen-vl-plus
## 视觉模型 API 地址（使用 OpenAI 兼容接口）
dashscope.vision.api.url=https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
## 语音识别模型（可选值：qwen2.5-audio-7b-instruct / qwen2-audio-7b-instruct / qwen-audio）
dashscope.audio.model.name=qwen2.5-audio-7b-instruct
## 文档分析模型（用于 PDF/Word/Excel 等文件识别，可选值：qwen-long / qwen-doc-turbo）
dashscope.document.model.name=qwen-long
## 视频理解抽帧频率（每秒抽取帧数，默认 2）
dashscope.video.fps=2



app.version=1.0.0

## 天气查询配置（默认北京）
weather.latitude=39.9042
weather.longitude=116.4074
weather.location=北京

