<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>{{company}}物流追踪</title>
  <link rel="stylesheet" href="/express/static/css/express.css?v=3">
</head>
<body>
  <main class="app">
    <header class="header">{{company}} · {{expressNo}}</header>

    <section class="map-section" id="mapWrap" hidden>
      <div id="mapContainer" aria-label="物流路线示意图"></div>
      <div class="map-overlay">
        <div class="status-badge"><span class="status-dot"></span><span>{{status}}</span></div>
        <button class="fullscreen-button" id="fullscreenBtn" type="button" aria-label="全屏查看路线">⛶</button>
      </div>
      <div class="progress-track">
        <div class="progress-rail"><div class="progress-fill" id="progressFill"></div><span class="progress-truck" id="progressTruck">🚚</span></div>
        <div class="progress-labels"><span id="startLabel"></span><span id="endLabel"></span></div>
      </div>
      <div class="address-panel">
        <div class="address-row"><span id="startAddressTitle">发货地址</span><p id="startAddress"></p></div>
        <div class="address-row"><span id="endAddressTitle">在途地址</span><p id="endAddress"></p></div>
      </div>
    </section>

    <section class="timeline-section">
      <h1>物流详情</h1>
      <div class="glass-card timeline">{{timeline}}</div>
    </section>
  </main>

  <script>
    window.__EXPRESS__ = { baiduAk: '{{baiduAk}}' };
    window.__MAP_DATA__ = {{mapData}};
  </script>
  <script src="/express/static/js/express.js?v=3"></script>
</body>
</html>
