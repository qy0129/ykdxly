<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07090c">
    <title>七日计划</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/daily-dashboard.css">
</head>
<body>
<div class="ambient-grain" aria-hidden="true"></div>
<main class="device-shell">
    <section class="planner-screen" aria-label="七日数字计划表">
        <canvas id="weather-canvas" class="weather-canvas" aria-hidden="true"></canvas>
        <aside class="editorial-rail">
            <div class="rail-heading">
                <span id="month-name" class="month-name">JULY</span>
                <span class="week-name">WEEK <b id="week-number">30</b></span>
            </div>
            <h1 id="rail-theme">深夜专注计划</h1>
            <div id="quote-list" class="quote-list"></div>
            <div class="weekly-note">
                <div class="note-label">本周记录</div>
                <p>保持节奏，也保留一点呼吸。</p>
                <div class="rail-progress"><span id="rail-progress"></span></div>
            </div>
        </aside>

        <div class="dashboard-content">
            <header class="date-summary">
                <div class="date-lockup">
                    <strong id="day-number">24</strong>
                    <div>
                        <span id="month-year">2026.07</span>
                        <span id="weekday">星期五</span>
                        <span>第<b id="header-week">30</b>周</span>
                    </div>
                </div>
                <div class="theme-block">
                    <span class="eyebrow">TODAY'S FOCUS</span>
                    <h2 id="main-theme">深夜专注计划</h2>
                    <p id="keyword">清醒 / 专注 / 完成</p>
                </div>
                <button id="refresh-button" class="icon-button" type="button" title="刷新数据" aria-label="刷新数据">↻</button>
            </header>

            <section class="metric-strip" aria-label="计划概览">
                <div class="completion-figure">
                    <div id="completion-ring" class="completion-ring"><span id="completion-rate">0%</span></div>
                    <div><small>完成率</small><strong id="remaining-count">0 项剩余</strong></div>
                </div>
                <div class="metric"><small>总计划</small><strong id="total-count">0</strong></div>
                <div class="metric"><small>已完成</small><strong id="completed-count">0</strong></div>
                <div class="metric"><small>专注安排</small><strong id="focus-time">未安排</strong></div>
                <div class="metric"><small>睡眠记录</small><strong id="sleep-time">未记录</strong></div>
                <div class="updated-time"><span class="status-dot"></span>更新于 <b id="updated-at">--:--</b></div>
            </section>

            <div class="workspace-grid">
                <section class="schedule-section">
                    <div class="section-heading">
                        <div><span>WEEKLY FLOW</span><h3>未来七天</h3></div>
                        <div class="legend" aria-label="任务图例">
                            <span><i class="legend-dot plan"></i>计划</span>
                            <span><i class="legend-dot calendar"></i>日历</span>
                            <span><i class="legend-dot todo"></i>待办</span>
                        </div>
                    </div>
                    <div class="schedule-scroll">
                        <div id="week-schedule" class="week-schedule"></div>
                    </div>
                    <div id="mobile-agenda" class="mobile-agenda"></div>
                </section>

                <aside class="insight-column">
                    <section class="todo-panel">
                        <div class="section-heading compact">
                            <div><span>NEXT ACTIONS</span><h3>待办事项</h3></div>
                            <strong id="todo-badge">0</strong>
                        </div>
                        <div id="todo-list" class="todo-list"></div>
                    </section>

                    <section class="weather-panel">
                        <div class="weather-topline">
                            <div><span id="weather-location">天气</span><strong id="weather-headline">正在更新</strong></div>
                            <div class="weather-mark" aria-hidden="true"><i></i><b></b><em></em></div>
                        </div>
                        <div id="weather-temperature" class="weather-temperature">--</div>
                        <div class="weather-grid">
                            <span>降水<strong id="weather-rain">--</strong></span>
                            <span>状态<strong id="weather-status">同步中</strong></span>
                        </div>
                        <p id="weather-details" class="weather-details"></p>
                    </section>
                </aside>
            </div>

            <section class="trend-band">
                <div class="trend-copy">
                    <span>7 DAY RHYTHM</span>
                    <h3>计划与完成趋势</h3>
                </div>
                <svg id="trend-chart" class="trend-chart" viewBox="0 0 720 90" preserveAspectRatio="none" role="img" aria-label="七日计划趋势图">
                    <g class="chart-grid"></g>
                    <polyline id="planned-line" class="chart-line planned" points=""></polyline>
                    <polyline id="completed-line" class="chart-line completed" points=""></polyline>
                    <g id="trend-labels" class="trend-labels"></g>
                </svg>
                <div class="trend-legend"><span><i class="planned"></i>计划时长</span><span><i class="completed"></i>完成数量</span></div>
            </section>
        </div>
    </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/static/js/daily-dashboard.js"></script>
</body>
</html>
